plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

repositories {
    maven { url = uri(providers.gradleProperty('repository').get()) }
}
def fx = 'io.vproxy:godot-jfx-'
def version = providers.gradleProperty('javafxVersion').get()
def platform = providers.gradleProperty('platform').getOrElse(
        System.getProperty('os.name') == 'Mac OS X' ? 'mac-aarch64' : 'win')
def withMedia = providers.gradleProperty('withMedia').isPresent()
dependencies {
    implementation "${fx}controls:${version}"
    runtimeOnly "${fx}graphics:${version}:${platform}"
    if (withMedia) {
        implementation "${fx}media:${version}:${platform}"
        implementation "${fx}swing:${version}"
    }
}
application { mainClass = withMedia ? 'MediaMain' : 'ShadowMain' }
tasks.compileJava {
    source files('../DirectApplication.java')
    if (withMedia) source files('src/media/java/MediaMain.java', '../../reference/MediaVideoProbe.java')
}
tasks.shadowJar {
    manifest { attributes 'Enable-Native-Access': 'ALL-UNNAMED' }
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
}
def scenePack = providers.gradleProperty('scenePack')
if (scenePack.isPresent()) {
    tasks.processResources {
        from(scenePack.get()) {
            into 'META-INF/godot-jfx'
            rename { 'scenes.pck' }
        }
    }
}
