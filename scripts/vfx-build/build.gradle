import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.3.1'
}

// Build VFX sources and the optional Intro shader demo against the local SDK.
// The original Gradle 7 / JavaFX 11 plugin build is retained for upstream users.
def workspace = file('../..')
layout.buildDirectory = new File(workspace, 'artifacts/vfx')
def distribution = new File(workspace, 'artifacts/godot-library')
def fxVersion = new File(distribution, 'version.txt').text.trim()
def os = System.getProperty('os.name')
def arch = System.getProperty('os.arch')
def platform = os.startsWith('Windows') && arch in ['amd64', 'x86_64'] ? 'win' :
        os == 'Mac OS X' && arch == 'aarch64' ? 'mac-aarch64' : null
repositories {
    exclusiveContent {
        forRepository { maven { url = new File(distribution, 'repository').toURI() } }
        filter {
            ['base', 'graphics', 'controls', 'fxml', 'media', 'swing'].each {
                includeModule 'io.vproxy', "godot-jfx-${it}"
            }
        }
    }
    mavenCentral()
}
configurations {
    demoRuntime { extendsFrom api }
}
configurations.demoRuntime.incoming.beforeResolve {
    if (!platform) throw new GradleException("VFX Demo JAR packaging is unavailable for ${os} ${arch}")
}
dependencies {
    implementation fileTree(new File(workspace, 'jfx/build/sdk/lib')) { include '*.jar' }
    api 'com.github.kwhat:jnativehook:2.2.2'
    api 'io.vproxy:commons:1.3.4'
    testImplementation 'junit:junit:4.13.2'
    demoRuntime "io.vproxy:godot-jfx-controls:${fxVersion}"
    demoRuntime "io.vproxy:godot-jfx-swing:${fxVersion}"
    demoRuntime "io.vproxy:godot-jfx-graphics:${fxVersion}:${platform}"
    demoRuntime "io.vproxy:godot-jfx-media:${fxVersion}:${platform}"
}
java { modularity.inferModulePath = true }
sourceSets {
    main {
        java.srcDirs = [new File(workspace, 'vfx/src/main/java')]
        resources.srcDirs = [new File(workspace, 'vfx/src/main/resources')]
    }
    test {
        java.srcDirs = [new File(workspace, 'vfx/src/test/java'), file('src/demo/java')]
        resources.srcDirs = [new File(workspace, 'vfx/src/test/resources')]
    }
}
tasks.named('shadowJar', ShadowJar) {
    dependsOn tasks.testClasses
    from(new File(workspace, 'vfx/LICENSE')) { into 'META-INF/licenses/vfx' }
    from(sourceSets.test.output.classesDirs) {
        include 'io/vproxy/vfx/intro/**', 'io/vproxy/vfx/test/TUtils*.class'
    }
    from(sourceSets.test.output.resourcesDir)
    configurations = [project.configurations.demoRuntime]
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
    manifest { attributes 'Main-Class': 'io.vproxy.vfx.intro.VfxDemoMain', 'Enable-Native-Access': 'ALL-UNNAMED', 'Multi-Release': 'true' }
    archiveFileName = 'vfx-demo.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('stageRuntime', Sync) {
    dependsOn tasks.testClasses
    from(configurations.testRuntimeClasspath) { exclude 'javafx*.jar' }
    into new File(workspace, 'artifacts/vfx/dependencies')
}
